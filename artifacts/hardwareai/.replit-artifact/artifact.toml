kind = "web"
previewPath = "/"
title = "Hardware AI Studio"
version = "1.0.0"
id = "artifacts/hardwareai"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21398

[services.development]
run = "pnpm --filter @workspace/hardwareai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/hardwareai", "run", "build" ]
publicDir = "artifacts/hardwareai/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21398"
BASE_PATH = "/"
